<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="hitch-signal" x1="6" y1="10" x2="58" y2="54" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a3e635" />
      <stop offset="1" stop-color="#38bdf8" />
    </linearGradient>
    <!-- Orbits pass behind the H nucleus. -->
    <mask id="hitch-nucleus" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff" />
      <circle cx="32" cy="32" r="13.5" fill="#000" />
    </mask>
  </defs>
  <g stroke="url(#hitch-signal)" stroke-width="4" mask="url(#hitch-nucleus)">
    <ellipse cx="32" cy="32" rx="28" ry="11" />
    <ellipse cx="32" cy="32" rx="28" ry="11" transform="rotate(60 32 32)" />
    <ellipse cx="32" cy="32" rx="28" ry="11" transform="rotate(120 32 32)" />
  </g>
  <!-- The H's crossbar is the hitch: the trace goes flat for a beat. -->
  <g stroke-width="4.5" stroke-linecap="round">
    <path d="M26.5 25.5v13M37.5 25.5v13" stroke="#fafafa" />
    <path d="M26.5 32h11" stroke="#fbbf24" />
  </g>
</svg>

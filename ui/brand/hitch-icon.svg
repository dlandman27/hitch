<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="none">
  <!-- App icon / favicon: the mark on a dark macOS-style tile, so it reads on light and dark tab bars. -->
  <defs>
    <linearGradient id="tile" x1="512" y1="100" x2="512" y2="924" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1b2430" />
      <stop offset="1" stop-color="#0b0f14" />
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="512" r="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a3e635" stop-opacity="0.18" />
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="hitch-signal" x1="6" y1="10" x2="58" y2="54" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a3e635" />
      <stop offset="1" stop-color="#38bdf8" />
    </linearGradient>
    <mask id="hitch-nucleus" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff" />
      <circle cx="32" cy="32" r="13.5" fill="#000" />
    </mask>
  </defs>
  <!-- 824px tile inside the 1024 canvas: Apple's icon grid margin. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" />
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" stroke="#ffffff" stroke-opacity="0.08" />
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)" />
  <g transform="translate(192 192) scale(10)">
    <g stroke="url(#hitch-signal)" stroke-width="4" mask="url(#hitch-nucleus)">
      <ellipse cx="32" cy="32" rx="28" ry="11" />
      <ellipse cx="32" cy="32" rx="28" ry="11" transform="rotate(60 32 32)" />
      <ellipse cx="32" cy="32" rx="28" ry="11" transform="rotate(120 32 32)" />
    </g>
    <g stroke-width="4.5" stroke-linecap="round">
      <path d="M26.5 25.5v13M37.5 25.5v13" stroke="#fafafa" />
      <path d="M26.5 32h11" stroke="#fbbf24" />
    </g>
  </g>
</svg>
